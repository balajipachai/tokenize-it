<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:640px;height:360px;overflow:hidden}
body{background:radial-gradient(circle at 22% 50%,#1e3a8a 0,#0f172a 58%);
  font-family:-apple-system,"SF Pro Display","Helvetica Neue",Arial,sans-serif;color:#fff;
  display:flex;align-items:center;gap:36px;padding:0 44px;box-sizing:border-box}
.mark{flex:0 0 184px;height:184px}.mark svg{width:184px;height:184px;display:block;
  filter:drop-shadow(0 18px 40px rgba(0,0,0,.45))}
h1{margin:0;font-size:46px;font-weight:800;letter-spacing:-1px;line-height:1}
.tag{margin:10px 0 0;font-size:18px;font-weight:600;color:#93c5fd}
.line{margin:14px 0 0;font-size:15px;line-height:1.45;color:#cbd5e1;max-width:330px}
.chips{display:flex;gap:8px;margin-top:18px}
.chips span{font-size:11.5px;font-weight:600;color:#e2e8f0;border:1px solid #334155;
  background:rgba(15,23,42,.6);border-radius:999px;padding:5px 11px}
</style></head><body>
<div class="mark"><svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b"/><stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="vested" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#059669"/><stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="116" y="296" width="52" height="90"  rx="12" fill="url(#vested)"/>
  <rect x="192" y="236" width="52" height="150" rx="12" fill="url(#vested)"/>
  <rect x="268" y="176" width="52" height="210" rx="12" fill="url(#vested)"/>
  <rect x="349" y="121" width="42" height="260" rx="9" fill="none" stroke="#3b82f6" stroke-width="10"/>
</svg></div>
<div>
  <h1>tokenize-it</h1>
  <p class="tag">Tokenized ESOPs on Hedera</p>
  <p class="line">Borrow against vested equity — without selling it or leaving your wallet.</p>
  <div class="chips"><span>Hedera ATS</span><span>Privy</span><span>Chainlink</span></div>
</div>
</body></html>
